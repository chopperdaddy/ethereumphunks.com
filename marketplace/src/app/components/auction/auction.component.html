@if (auction$ | async; as auction) {
  <!-- {{ auction | json }} -->
  <div class="bid-info">
    <div class="bid-info-item">
      <div class="label">Bids</div>
      <div class="value">{{ bidsLength() }}</div>
    </div>

    <div class="bid-info-item current-bid">
      <div class="label">
        {{ auctionComplete() ? 'Winning' : 'Current' }}
      </div>
      <div class="value">
        <span class="eth-symbol">Ξ</span>{{ ((auction.amount | weiToEth) || '0') | number }}
      </div>
    </div>

    <div class="bid-info-item time-remaining">
      <div class="label">Time remaining</div>
      <div class="value">
        <app-timer
          [endTime]="auction.endTime"
          (timeLeft)="handleTimeLeft($event)">
        </app-timer>
      </div>
    </div>
  </div>

  <div
    class="form-wrapper"
    [class.is-complete]="auctionComplete()">

    <!-- <div class="connect">
      <button
        (click)="web3Svc.connect()">
        Connect your wallet to interact with this auction
      </button>
    </div> -->

    @if (auctionComplete()) {
      <div class="auction-complete">
        <p>This auction is complete</p>
      </div>
    } @else {
      <div class="form">
        <div class="input-wrapper">
          <input
            type="number"
            [formControl]="bidValue"
            [placeholder]="(((auction.amount | weiToEth) + ((auction.amount | weiToEth) * auction.minBidIncrementPercentage / 100)) | number : '1.0-8') + ' ETH or more'"
          />

          <div class="info">
            <ng-template [ngTemplateOutlet]="questionMarkIcon" />
          </div>
        </div>

        <button
          (click)="submitBid()"
          type="submit">

          Place Bid
        </button>
      </div>
    }
  </div>

  <div
    class="error"
    [class.active]="errorMessage()?.length">

    <button (click)="closeError()">x</button>
    {{ errorMessage() }}
  </div>

  <app-bid-history
    [auction]="auction"
    (bidsLength)="bidsLength.set($event)"
  />
}

<ng-template #questionMarkIcon>
  <svg height="26" viewBox="0 0 26 26" width="26" xmlns="http://www.w3.org/2000/svg"><path d="m16 24v2h-6v-2zm4-2v2h-4v-2zm-10 0v2h-4v-2zm12-2v2h-2v-2zm-16 0v2h-2v-2zm18-4v4h-2v-4zm-20 0v4h-2v-4zm10 0v2h-2v-2zm12-6v6h-2v-6zm-24 0v6h-2v-6zm14 2v2h-4v-2zm-6-2v2h-2v-2zm8 0v2h-2v-2zm6-4v4h-2v-4zm-20 0v4h-2v-4zm12 2v2h-6v-2zm6-4v2h-2v-2zm-16 0v2h-2v-2zm4-2v2h-4v-2zm10 0v2h-4v-2zm-4-2v2h-6v-2z" fill-rule="evenodd" fill="rgba(var(--text-color), 1)" /></svg>
</ng-template>
