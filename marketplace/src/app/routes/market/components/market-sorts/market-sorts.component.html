
<div class="sort-wrapper">
  <div class="label">Sort:</div>

  <ng-select
    class="sort"
    [ngModel]="activeSortOption()"
    (change)="setSort($event)"
    [searchable]="false"
    [clearable]="false">

    @for (sort of sorts(); track sort) {
      <ng-option [value]="sort">{{ sortLabels[sort] }}</ng-option>
    }
  </ng-select>
</div>
